[project]
name = "voice-sales-agent"
version = "0.1.0"
description = "Cloud-hosted voice AI sales agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "deepagents>=0.7.21",
    "docx2txt>=0.9",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.142.2",
    "greenlet>=3.5.6",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.6.7",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.12",
    "langsmith>=0.14.4",
    "livekit-agents[langchain]~=1.8",
    "livekit-plugins-deepgram>=1.8.4",
    "livekit-plugins-groq>=1.8.4",
    "livekit-plugins-noise-cancellation>=0.3.2",
    "livekit-plugins-silero>=1.8.4",
    "livekit-plugins-turn-detector>=1.8.4",
    "pipecat-ai-prebuilt>=1.3.0",
    "pipecat-ai[deepgram,groq,livekit,silero,webrtc]>=1.9.0,<2",
    "psycopg[binary]>=3.3.6",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.pyright]
extraPaths = ["."]

